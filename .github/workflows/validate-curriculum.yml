name: Validate Madrasti curriculum

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check runtime JavaScript syntax
        run: node --check curriculum-runtime.js
      - name: Check inline application scripts
        run: node scripts/check-inline-scripts.mjs
      - name: Validate curriculum JSON and lesson indexes
        run: node scripts/validate-curriculum.mjs
      - name: Test validator edge cases
        run: node --test scripts/test-validator.test.mjs
      - name: Test local progress storage handling
        run: node --test scripts/test-progress-storage.test.mjs
      - name: Test runtime question list filtering
        run: node --test scripts/test-runtime-question-list.test.mjs
      - name: Test Arabic answer normalization
        run: node --test scripts/test-answer-normalization.test.mjs
      - name: Test family profile save rollback
        run: node --test scripts/test-family-save.test.mjs

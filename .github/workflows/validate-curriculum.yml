name: Validate Madrasti curriculum

on:
  push:
    branches: [main, work/msa-auto-read-retry, work/madrasti-ui, work/madrasti-curriculum]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check runtime JavaScript syntax
        run: node --check curriculum-runtime.js
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
      - name: Check inline application scripts
        run: node scripts/check-inline-scripts.mjs
      - name: Validate curriculum JSON and lesson indexes
        run: node scripts/validate-curriculum.mjs
      - name: Test grade 2 mathematics outline index
        run: node --test scripts/test-grade2-math-index.test.mjs
      - name: Test validator edge cases
        run: node --test scripts/test-validator.test.mjs
      - name: Test curriculum mastery validation
        run: node --test scripts/test-curriculum-mastery-validation.test.mjs
      - name: Test local progress storage handling
        run: node --test scripts/test-progress-storage.test.mjs
      - name: Test runtime question list filtering
        run: node --test scripts/test-runtime-question-list.test.mjs
      - name: Test Arabic answer normalization
        run: node --test scripts/test-answer-normalization.test.mjs
      - name: Test family profile save rollback
        run: node --test scripts/test-family-save.test.mjs
      - name: Test safe migration of legacy family data
        run: node --test scripts/test-legacy-migration.test.mjs
      - name: Test isolated child lesson progress
        run: node --test scripts/test-child-progress.test.mjs
      - name: Test safe child profile deletion
        run: node --test scripts/test-child-deletion.test.mjs
      - name: Test transactional lesson completion
        run: node --test scripts/test-lesson-completion.test.mjs
      - name: Test lesson mastery enforcement
        run: node --test scripts/test-mastery-enforcement.test.mjs
      - name: Test interactive pattern activity
        run: node --test scripts/test-pattern-activity.test.mjs
      - name: Test numeral tracing activity
        run: node --test scripts/test-trace-numeral-activity.test.mjs
      - name: Test speech lifecycle cancellation
        run: node --test scripts/test-speech-lifecycle.test.mjs
      - name: Test MSA narration, automatic question reading, and retries
        run: node --test scripts/test-msa-auto-read-retry.test.mjs
      - name: Test view navigation resets lesson context
        run: node --test scripts/test-view-navigation.test.mjs
      - name: Test offline service worker behavior
        run: node --test scripts/test-service-worker.test.mjs
      - name: Test local PDF preview validation
        run: node --test scripts/test-pdf-preview.test.mjs
      - name: Test family backup and restore
        run: node --test scripts/test-family-backup.test.mjs
      - name: Test separate student application entry
        run: node --test scripts/test-student-app-separation.test.mjs
      - name: Test student profile and progress transfer
        run: node --test scripts/test-student-transfer.test.mjs
      - name: Test student rewards and badge milestones
        run: node --test scripts/test-reward-system.test.mjs
